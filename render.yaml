services:
  - type: web
    name: aicte-smartflow-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m alembic upgrade head && python -m app.seed_data && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./aicte_smartflow.db

  - type: web
    name: aicte-smartflow-frontend
    env: static
    buildCommand: "cd frontend && npm install --legacy-peer-deps && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
